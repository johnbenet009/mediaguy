name: Desktop Releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vite-core/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci --prefix vite-core --no-audit --no-fund

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package version v$version" }

      - name: Build and publish Windows installer
        run: npm run release-win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vite-core/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci --prefix vite-core --no-audit --no-fund

      - name: Verify tag matches app version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${{ github.ref_name }}"

      - name: Build and publish Linux packages
        run: npm run release-linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
